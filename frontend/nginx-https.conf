limit_req_zone $binary_remote_addr zone=oeis_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=oeis_login:10m rate=5r/m;
server { listen 8080; server_name _; return 301 https://$host$request_uri; }
server {
  listen 443 ssl http2; server_name oeis.company.com;
  ssl_certificate /etc/nginx/tls/fullchain.pem; ssl_certificate_key /etc/nginx/tls/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3; server_tokens off; client_max_body_size 1m; client_body_timeout 10s; keepalive_timeout 30s;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff; add_header X-Frame-Options DENY; add_header Referrer-Policy no-referrer;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self'; form-action 'self'" always;
  root /usr/share/nginx/html; index index.html;
  location / { try_files $uri /index.html; }
  location = /api/auth/login { limit_req zone=oeis_login burst=3 nodelay; proxy_pass http://backend:8000/api/auth/login; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_connect_timeout 5s; proxy_read_timeout 30s; }
  location /api/ { limit_req zone=oeis_api burst=40 nodelay; add_header Cache-Control "no-store" always; proxy_pass http://backend:8000/api/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_connect_timeout 5s; proxy_read_timeout 120s; }
}
