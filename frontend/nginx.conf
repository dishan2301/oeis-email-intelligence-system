limit_req_zone $binary_remote_addr zone=oeis_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=oeis_login:10m rate=5r/m;
server {
  listen 8080; server_tokens off; root /usr/share/nginx/html; index index.html;
  client_max_body_size 1m; client_body_timeout 10s; keepalive_timeout 30s;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self'; form-action 'self'" always;
  location / { try_files $uri /index.html; }
  location = /api/auth/login { limit_req zone=oeis_login burst=3 nodelay; proxy_pass http://backend:8000/api/auth/login; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_connect_timeout 5s; proxy_read_timeout 30s; }
  location /api/ { limit_req zone=oeis_api burst=40 nodelay; add_header Cache-Control "no-store" always; proxy_pass http://backend:8000/api/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_connect_timeout 5s; proxy_read_timeout 120s; }
}
