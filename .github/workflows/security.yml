name: Security and quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install locked runtime and security tools
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install pytest==8.4.1 pip-audit==2.10.1 bandit==1.9.4 cyclonedx-bom==7.3.1
      - name: Unit and abuse-case tests
        run: python -m pytest -q
      - name: Dependency vulnerability gate
        run: pip-audit --disable-pip --no-deps -r requirements.lock
      - name: Static security gate
        run: bandit -q -r app -x tests -lll
      - name: Migration smoke test
        env:
          DATABASE_URL: sqlite:///./ci-migration.db
        run: alembic upgrade head
      - name: Generate Python SBOM
        run: cyclonedx-py requirements requirements.lock --output-file python-sbom.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-sbom
          path: backend/python-sbom.json
          retention-days: 30

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Dependency vulnerability gate
        run: npm audit --audit-level=high
      - run: npm run build
      - name: Generate frontend SBOM
        run: npm sbom --sbom-format=cyclonedx > frontend-sbom.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-sbom
          path: frontend/frontend-sbom.json
          retention-days: 30
